name: otel_command_it
description: >-
  OpenTelemetry instrumentation for package:command_it (Thomas Burkhart's
  renamed flutter_command). Wraps each Command execution in a CLIENT-kind
  span with duration and failures.
version: 0.2.0
repository: https://github.com/dartastic/otel_command_it
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  command_it: ^9.0.0
  dartastic_opentelemetry: ^1.1.0-beta.12
  dartastic_opentelemetry_api: ^1.0.0-rc.1
  flutter:
    sdk: flutter

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  flutter_test:
    sdk: flutter
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
